  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: {
              bg: '#F7F3EB',
              panel: '#EFE9DE',
              card: '#FAF7F2',
              border: '#DDD3C4',
              dark: '#2C2825',
              muted: '#786F66',
              ink: '#221F1D',
              sage: '#4A5D4E',
              terracotta: '#B56345',
              gold: '#C89B57'

          },
          fontFamily: {
            serif: ['"Cormorant Garamond"', '"Noto Serif TC"', 'Georgia', 'serif'],
            sans: ['system-ui', '-apple-system', '"Noto Sans TC"', 'sans-serif'],
            display: ['"Cormorant Garamond"', '"Noto Serif TC"', 'serif']
          }
        }
      }

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #F7F3EB;
      color: #221F1D;
      font-family: system-ui, -apple-system, 'Noto Sans TC', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* 溫潤法式手揉宣紙微粒紋理 */
    .paper-texture {
      background-color: #F7F3EB;
      background-image:
        radial-gradient(rgba(34, 31, 29, 0.038) 1px, transparent 0),
        radial-gradient(rgba(181, 99, 69, 0.024) 1px, #F7F3EB 0);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
    }

    /* 漫遊畫布手勢游標 */
    .canvas-grab {
      cursor: grab;
    }
    .canvas-grab:active {
      cursor: grabbing;
    }

    /* 雞蛋花瓣與花萼變形錨點 */
    .petal-unit {
      transform-origin: 150px 150px;
      will-change: transform;
    }
    .sepal-unit {
      transform-origin: 150px 172px;
    }
    .ink-multiply {
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    /* 節點層級與懸停互動 */
    .flower-node {
      transition: filter 0.35s ease;
    }
    .flower-node:hover {
      z-index: 30 !important;
    }

    /* 待開花苞：滑鼠懸停時的透光呼吸浮動 */
    @keyframes budFloatGlow {
      0%, 100% {
        transform: translateY(0px) scale(1);
        filter: drop-shadow(0 4px 10px rgba(74, 93, 78, 0.12));
      }
      50% {
        transform: translateY(-5px) scale(1.035);
        filter: drop-shadow(0 8px 20px rgba(181, 99, 69, 0.28));
      }
    }
    .bud-svg-wrapper {
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), filter 0.45s ease;
    }
    .flower-node:hover .bud-svg-wrapper {
      animation: budFloatGlow 2.6s ease-in-out infinite;
    }
    .bud-inner-glow {
      opacity: 0.18;
      transition: opacity 0.45s ease, transform 0.45s ease;
      transform-origin: 150px 138px;
    }
    .flower-node:hover .bud-inner-glow {
      opacity: 0.65;
      transform: scale(1.12);
    }
    .bud-sepal-left,
    .bud-sepal-right {
      transform-origin: 150px 182px;
      transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .flower-node:hover .bud-sepal-left {
      transform: rotate(-4deg);
    }
    .flower-node:hover .bud-sepal-right {
      transform: rotate(4deg);
    }

    /* 螢幕中央聚光燈感應圈呼吸動畫 */
    @keyframes pulseSpotlight {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.45; }
      50% { transform: translate(-50%, -50%) scale(1.018); opacity: 0.75; }
    }
    .spotlight-ring {
      animation: pulseSpotlight 4.5s ease-in-out infinite;
    }

    /* 首次進站手勢滑動引導動畫 */
    @keyframes swipeCue {
      0% { transform: translateX(55px); opacity: 0; }
      25% { opacity: 0.95; }
      75% { transform: translateX(-55px); opacity: 0.95; }
      100% { transform: translateX(-55px); opacity: 0; }
    }
    .swipe-hand-anim {
      animation: swipeCue 2.2s ease-in-out infinite;
    }

    /* 抽屜頂部圓盤：滑鼠懸停時墨線花蕊柔化退開 */
    .plate-morph-container:hover .plate-stamen-overlay {
      opacity: 0.06 !important;
      transform: scale(1.06);
    }
    .plate-stamen-overlay {
      transition: opacity 0.5s ease, transform 0.5s ease;
      transform-origin: center;
    }

    /* 自訂捲軸 */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: #EFE9DE;
    }
    ::-webkit-scrollbar-thumb {
      background-color: #C9BDA9;
      border-radius: 999px;
    }
  </style>
</head>

      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }

      // =======================================================================
      // 3. 幾何路徑建構：5 瓣厚實圓潤微螺旋「雞蛋花 (Frangipani)」
      // =======================================================================
      function ptWorld(lx, ly, deg, scale = 1) {
        const sx = lx * scale;
        const sy = ly * scale;
        const rad = (deg * Math.PI) / 180;
        const c = Math.cos(rad);
        const s = Math.sin(rad);
        const wx = FCX + (sx * c - sy * s);
        const wy = FCY + (sx * s + sy * c);
        return `${wx.toFixed(1)},${wy.toFixed(1)}`;
      }

      function buildFrangipaniPetalPath(angleDeg, inset = 1.0) {
        const p = (x, y) => ptWorld(x, y, angleDeg, inset);
        return [
          `M ${p(0, 0)}`,
          `C ${p(-14, -18)} ${p(-38, -52)} ${p(-36, -84)}`,
          `C ${p(-34, -108)} ${p(-14, -122)} ${p(8, -120)}`,
          `C ${p(32, -118)} ${p(50, -96)} ${p(46, -68)}`,
          `C ${p(42, -38)} ${p(18, -12)} ${p(0, 0)} Z`
        ].join(' ');
      }

      function buildFrangipaniVeins(angleDeg) {
        const p = (x, y) => ptWorld(x, y, angleDeg, 1.0);
        return [
          `M ${p(0, -6)} Q ${p(5, -56)} ${p(6, -110)}`,
          `M ${p(2, -28)} Q ${p(-14, -48)} ${p(-24, -72)}`,
          `M ${p(4, -46)} Q ${p(-12, -68)} ${p(-22, -92)}`,
          `M ${p(3, -34)} Q ${p(22, -52)} ${p(34, -72)}`,
          `M ${p(5, -56)} Q ${p(22, -74)} ${p(30, -94)}`
        ].join(' ');
      }

      function initGlobalFrangipaniClips() {
        const defs = document.getElementById('global-flower-defs');
        let clipsHTML = '';
        for (let i = 0; i < 5; i++) {
          const deg = i * 72 - 18;
          const d = buildFrangipaniPetalPath(deg, 0.965);
          clipsHTML += `<clipPath id="frangipani-clip-${i}" clipPathUnits="userSpaceOnUse"><path d="${d}"/></clipPath>`;
        }
        defs.insertAdjacentHTML('beforeend', clipsHTML);
      }

      function buildFrangipaniCenterMarkup() {
        let spiralLines = '';
        for (let i = 0; i < 5; i++) {
          const deg = i * 72 - 18;
          const p = (x, y) => ptWorld(x, y, deg, 1.0);
          spiralLines += `M ${p(0, 0)} Q ${p(10, -10)} ${p(4, -22)} `;
        }
        return `
          <circle cx="${FCX}" cy="${FCY}" r="36" fill="url(#frangipani-warm-core)" pointer-events="none"/>
          <path d="${spiralLines}" fill="none" stroke="#221F1D" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="${FCX}" cy="${FCY}" r="5.5" fill="#F7F3EB" stroke="#221F1D" stroke-width="1.8"/>
          <circle cx="${FCX}" cy="${FCY}" r="2.2" fill="#B56345"/>
        `;
      }

      // =======================================================================
      // 4. 生成「肯亞家常饗宴 (4 道料理)」空拍餐桌質感紋理
      // =======================================================================
      function generateKenyanFeastPhotoTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 520;
        canvas.height = 520;
        const ctx = canvas.getContext('2d');

        const bgGrad = ctx.createRadialGradient(260, 260, 30, 260, 260, 260);
        bgGrad.addColorStop(0, '#F5E6CE');
        bgGrad.addColorStop(0.65, '#C88A56');
        bgGrad.addColorStop(1, '#5E3824');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 520, 520);

        const platters = [
          { x: 185, y: 185, r: 108, base: '#9C4D2B', highlight: '#D98B4E', rim: '#F2E3CE' },
          { x: 340, y: 190, r: 98, base: '#E0A458', highlight: '#FCE6BA', rim: '#EAD7BE' },
          { x: 195, y: 335, r: 94, base: '#8B3E26', highlight: '#C96A3B', rim: '#F0DFC8' },
          { x: 335, y: 335, r: 92, base: '#5A7D4C', highlight: '#9EC47E', rim: '#EFE2CE' }
        ];

        platters.forEach((pl) => {
          ctx.beginPath();
          ctx.arc(pl.x, pl.y, pl.r + 6, 0, Math.PI * 2);
          ctx.fillStyle = pl.rim;
          ctx.fill();

          const g = ctx.createRadialGradient(pl.x - 15, pl.y - 15, 8, pl.x, pl.y, pl.r);
          g.addColorStop(0, pl.highlight);
          g.addColorStop(0.7, pl.base);
          g.addColorStop(1, '#3D2214');
          ctx.beginPath();
          ctx.arc(pl.x, pl.y, pl.r, 0, Math.PI * 2);
          ctx.fillStyle = g;
          ctx.fill();
        });

        // Chapati 螺旋烙痕
        ctx.save();
        ctx.strokeStyle = 'rgba(122, 62, 24, 0.55)';
        ctx.lineWidth = 3.2;
        for (let r = 16; r <= 72; r += 14) {
          ctx.beginPath();
          ctx.arc(340, 190, r, 0.2, Math.PI * 1.75);
          ctx.stroke();
        }
        for (let i = 0; i < 18; i++) {
          const a = (i * 137.5 * Math.PI) / 180;
          const d = 12 + (i % 5) * 14;
          ctx.fillStyle = 'rgba(110, 48, 16, 0.48)';
          ctx.beginPath();
          ctx.arc(340 + Math.cos(a) * d, 190 + Math.sin(a) * d, 3 + (i % 3), 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Pilau 香料飯與羊肉
        ctx.save();
        for (let i = 0; i < 42; i++) {
          const a = (i * 137.5 * Math.PI) / 180;
          const d = Math.sqrt(i) * 13;
          const rx = 185 + Math.cos(a) * d;
          const ry = 185 + Math.sin(a) * d;
          ctx.fillStyle = i % 5 === 0 ? 'rgba(92, 38, 18, 0.85)' : 'rgba(252, 224, 178, 0.65)';
          ctx.beginPath();
          ctx.ellipse(rx, ry, i % 5 === 0 ? 11 : 5, i % 5 === 0 ? 8 : 2.2, i, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        // Kamande 扁豆與 Kabeji 甘藍番茄
        ctx.save();
        for (let i = 0; i < 28; i++) {
          const a = (i * 137.5 * Math.PI) / 180;
          const d = Math.sqrt(i) * 14;
          ctx.fillStyle = i % 4 === 0 ? 'rgba(82, 130, 68, 0.75)' : 'rgba(235, 148, 82, 0.6)';
          ctx.beginPath();
          ctx.arc(195 + Math.cos(a) * d, 335 + Math.sin(a) * d, 4.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = i % 3 === 0 ? 'rgba(218, 68, 48, 0.85)' : 'rgba(235, 248, 215, 0.65)';
          ctx.beginPath();
          ctx.ellipse(335 + Math.cos(a) * d, 335 + Math.sin(a) * d, 7, 3.2, i * 0.7, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        return canvas.toDataURL('image/jpeg', 0.92);
      }

      // =======================================================================

      //    (A) 第 1 朵盛開雞蛋花：背後僅在左下單側使用 <use href="#botanical-leaf-branch" />

      // =======================================================================
      // 8. 雞蛋花 3D 透視螺旋綻放渲染器
      // =======================================================================
      function easeOutBack(t) {
        const c1 = 1.28;
        const c3 = c1 + 1;
        return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
      }

      function applyFrangipaniBloom(flower, bloomProgress) {
        if (flower.status !== 'bloom') return;

        const sepalL = document.getElementById(`world-sepal-l-${flower.id}`);
        const sepalR = document.getElementById(`world-sepal-r-${flower.id}`);
        if (sepalL && sepalR) {
          const st = clamp(bloomProgress / 0.65, 0, 1);
          const rotL = 18 - st * 58;
          const rotR = -18 + st * 58;
          const sc = 1.0 - st * 0.24;
          sepalL.style.transform = `rotate(${rotL.toFixed(1)}deg) scale(${sc.toFixed(2)})`;
          sepalR.style.transform = `rotate(${rotR.toFixed(1)}deg) scale(${sc.toFixed(2)})`;
        }

        const colorFactor = clamp((bloomProgress - 0.18) / 0.72, 0, 1);
        document.querySelectorAll(`.world-photo-layer-${flower.id}`).forEach((layer) => {
          layer.style.opacity = (0.18 + 0.82 * colorFactor).toFixed(2);
        });

        for (let i = 0; i < 5; i++) {
          const petalEl = document.getElementById(`world-petal-${flower.id}-${i}`);
          if (!petalEl) continue;

          const staggerDelay = i * 0.055;
          const localP = clamp((bloomProgress - staggerDelay) / (1 - staggerDelay), 0, 1);
          const eased = easeOutBack(localP);

          const sx = 0.42 + 0.58 * eased;
          const sy = 0.30 + 0.70 * eased;
          const spiralTwist = 26 * (1 - localP);
          const breeze = Math.sin(state.idleClock * 1.45 + i * 1.2) * 1.15 * bloomProgress;
          const rot = spiralTwist + breeze;

          petalEl.style.transform = `rotate(${rot.toFixed(2)}deg) scale(${sx.toFixed(3)}, ${sy.toFixed(3)})`;
        }

        const stamenEl = document.getElementById(`world-stamen-${flower.id}`);
        if (stamenEl) {
          const stP = clamp((bloomProgress - 0.25) / 0.75, 0, 1);
          stamenEl.style.opacity = (0.3 + 0.7 * stP).toFixed(2);
          stamenEl.style.transform = `scale(${(0.5 + 0.5 * stP).toFixed(2)})`;
        }
      }

      // =======================================================================
      // 10. 攝影機邊界鎖定 (Camera Clamp) 與聚落/花朵平滑定位
      // =======================================================================
      function getCameraBounds() {
        const viewport = document.getElementById('garden-viewport');
        const vw = viewport.clientWidth || window.innerWidth;
        const vh = viewport.clientHeight || window.innerHeight - 61;
        const minX = Math.min(-180, vw - WORLD_W - 140);
        const maxX = 180;
        const minY = Math.min(-160, vh - WORLD_H - 120);
        const maxY = 160;
        return { vw, vh, minX, maxX, minY, maxY };
      }

      function centerCameraOnWorldPoint(wx, wy, offsetX = 0) {
        const { vw, vh, minX, maxX, minY, maxY } = getCameraBounds();
        state.targetCamX = clamp(vw / 2 + offsetX - wx, minX, maxX);
        state.targetCamY = clamp(vh / 2 - wy, minY, maxY);
      }

      function centerCameraOnFlower(flowerId, withDrawerOffset = false) {
        const f = FLOWERS[flowerId];
        if (!f) return;
        const offsetX = withDrawerOffset && window.innerWidth > 640 ? -120 : 0;
        centerCameraOnWorldPoint(f.worldX, f.worldY, offsetX);
      }

      // =======================================================================
      // 11. 主動畫循環：攝影機插值、聚光燈自動綻放與蒲公英正弦漂浮
      // =======================================================================
      let lastTime = performance.now();

      function animateLoop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        state.idleClock += dt;

        state.camX += (state.targetCamX - state.camX) * 0.11;
        state.camY += (state.targetCamY - state.camY) * 0.11;

        const artWorld = document.getElementById('art-world');
        artWorld.style.transform = `translate3d(${state.camX.toFixed(1)}px, ${state.camY.toFixed(1)}px, 0)`;

        const { vw, vh } = getCameraBounds();
        const spotlightOffsetX = state.drawerOpen && window.innerWidth > 640 ? -120 : 0;
        const focusWorldX = vw / 2 + spotlightOffsetX - state.camX;
        const focusWorldY = vh / 2 - state.camY;
        const focusRadius = Math.min(vw, vh) * 0.42;

        FLOWERS.forEach((flower, idx) => {
          if (flower.status !== 'bloom') return;
          const fState = state.flowers[idx];
          const dist = Math.hypot(flower.worldX - focusWorldX, flower.worldY - focusWorldY);

          if (
            dist < focusRadius ||
            state.hoveredFlowerId === flower.id ||
            state.selectedFlowerId === flower.id
          ) {
            fState.targetBloom = 1.0;
          } else {
            fState.targetBloom = 0.35;
          }

          fState.currentBloom += (fState.targetBloom - fState.currentBloom) * 0.085;
          applyFrangipaniBloom(flower, fState.currentBloom);
        });

        document.querySelectorAll('.world-dandelion-seed').forEach((seedEl) => {
          const bx = parseFloat(seedEl.getAttribute('data-bx'));
          const by = parseFloat(seedEl.getAttribute('data-by'));
          const idx = parseInt(seedEl.getAttribute('data-idx'), 10);
          const dx = Math.sin(state.idleClock * 0.85 + idx * 1.3) * 16;
          const dy = Math.cos(state.idleClock * 1.05 + idx * 0.9) * 13;
          const rot = -18 + Math.sin(state.idleClock * 0.75 + idx) * 16;
          seedEl.setAttribute(
            'transform',
            `translate(${(bx + dx).toFixed(1)}, ${(by + dy).toFixed(1)}) rotate(${rot.toFixed(1)})`
          );
        });

        requestAnimationFrame(animateLoop);
      }

      // =======================================================================
      // 12. 雙語切換、首次進站手勢引導銷毀與互動事件綁定
      // =======================================================================
      function applyLanguageDisplay(lang) {
        state.lang = lang;
        document.documentElement.setAttribute('data-lang', lang);
        document.documentElement.lang = lang;
        try {
          localStorage.setItem('table_blooms_lang', lang);
        } catch (e) {}

        document.querySelectorAll('.lang-fr').forEach((el) => {
          el.classList.toggle('hidden', lang !== 'fr');
        });
        document.querySelectorAll('.lang-en').forEach((el) => {
          el.classList.toggle('hidden', lang !== 'en');
        });

        document.querySelectorAll('.lang-btn').forEach((btn) => {
          const isMatch = btn.getAttribute('data-set-lang') === lang;
          btn.className = isMatch
            ? 'lang-btn px-2.5 py-1 rounded-full font-medium transition-colors bg-paper-ink text-paper-bg'
            : 'lang-btn px-2.5 py-1 rounded-full font-medium transition-colors text-paper-muted hover:text-paper-ink';
        });
      }

      function bindEvents() {
        const viewport = document.getElementById('garden-viewport');

        // 首次進站手勢滑動引導自動銷毀邏輯
        const hintEl = document.getElementById('swipe-hint');
        const dismissHint = () => {
          if (hintEl && !hintEl.classList.contains('opacity-0')) {
            hintEl.classList.add('opacity-0');
            setTimeout(() => hintEl.remove(), 700);
          }
        };
        setTimeout(dismissHint, 3800);
        viewport.addEventListener('mousedown', dismissHint, { once: true });
        viewport.addEventListener('touchstart', dismissHint, { once: true });

        // 滑鼠拖曳平移畫布
        viewport.addEventListener('mousedown', (e) => {
          if (e.target.closest('button, a')) return;
          state.isDragging = true;
          state.hasMovedDuringDrag = false;
          state.dragStartX = e.clientX;
          state.dragStartY = e.clientY;
          state.camStartX = state.targetCamX;
          state.camStartY = state.targetCamY;
        });

        window.addEventListener('mousemove', (e) => {
          if (!state.isDragging) return;
          const dx = e.clientX - state.dragStartX;
          const dy = e.clientY - state.dragStartY;
          if (Math.hypot(dx, dy) > 5) state.hasMovedDuringDrag = true;
          const { minX, maxX, minY, maxY } = getCameraBounds();
          state.targetCamX = clamp(state.camStartX + dx, minX, maxX);
          state.targetCamY = clamp(state.camStartY + dy, minY, maxY);
        });

        window.addEventListener('mouseup', () => {
          state.isDragging = false;
        });

        // 點擊畫布空白處時收合右側抽屜
        viewport.addEventListener('click', (e) => {
          if (state.hasMovedDuringDrag) return;
          if (!e.target.closest('.flower-node, button, a') && state.drawerOpen) {
            closeStoryDrawer();
          }
        });

        // 觸控螢幕滑動平移
        viewport.addEventListener('touchstart', (e) => {
          if (e.touches.length !== 1) return;
          state.isDragging = true;
          state.hasMovedDuringDrag = false;
          state.dragStartX = e.touches[0].clientX;
          state.dragStartY = e.touches[0].clientY;
          state.camStartX = state.targetCamX;
          state.camStartY = state.targetCamY;
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
          if (!state.isDragging || e.touches.length !== 1) return;
          const dx = e.touches[0].clientX - state.dragStartX;
          const dy = e.touches[0].clientY - state.dragStartY;
          if (Math.hypot(dx, dy) > 6) state.hasMovedDuringDrag = true;
          const { minX, maxX, minY, maxY } = getCameraBounds();
          state.targetCamX = clamp(state.camStartX + dx, minX, maxX);
          state.targetCamY = clamp(state.camStartY + dy, minY, maxY);
        }, { passive: true });

        viewport.addEventListener('touchend', () => {
          state.isDragging = false;
        });

        // 滾輪 / 觸控板雙指平移
        viewport.addEventListener('wheel', (e) => {
          e.preventDefault();
          const { minX, maxX, minY, maxY } = getCameraBounds();
          state.targetCamX = clamp(state.targetCamX - e.deltaX * 0.85, minX, maxX);
          state.targetCamY = clamp(state.targetCamY - e.deltaY * 0.85, minY, maxY);
        }, { passive: false });

        // 左下角極簡聚落膠囊導覽 (Table I)
        document.getElementById('btn-cluster-nav').addEventListener('click', () => {
          closeStoryDrawer();
          centerCameraOnWorldPoint(CLUSTER_I_CENTER.x, CLUSTER_I_CENTER.y, 0);
        });

        // 語言切換按鈕
        document.querySelectorAll('.lang-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            applyLanguageDisplay(btn.getAttribute('data-set-lang'));
          });
        });

        window.addEventListener('resize', () => {
          if (state.drawerOpen && state.selectedFlowerId !== null) {
            centerCameraOnFlower(state.selectedFlowerId, true);
          } else {
            centerCameraOnWorldPoint(CLUSTER_I_CENTER.x, CLUSTER_I_CENTER.y, 0);
          }
        });
      }

      // =======================================================================
      // 啟動餐桌記憶花園
      // =======================================================================
      window.addEventListener('DOMContentLoaded', () => {
        state.flowers[0].photoDataUrl = generateKenyanFeastPhotoTexture();

        initGlobalFrangipaniClips();
        buildWorldBotanicalBackground();
        mountGardenFlowers();
        bindEvents();

        const savedLang = (() => {
          try { return localStorage.getItem('table_blooms_lang'); } catch (e) { return null; }
        })();
        applyLanguageDisplay(savedLang === 'en' ? 'en' : 'fr');

        centerCameraOnWorldPoint(CLUSTER_I_CENTER.x, CLUSTER_I_CENTER.y, 0);
        state.camX = state.targetCamX;
        state.camY = state.targetCamY;

        requestAnimationFrame(animateLoop);
      });
    })();
  </script>
</body>
</html>
